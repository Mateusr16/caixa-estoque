    <use href="#e" transform="rotate(50) translate(0 -43) rotate(-50)"/>
    <use href="#e" transform="rotate(70) translate(0 -43) rotate(-70)"/>
    <use href="#e" transform="rotate(90) translate(0 -43) rotate(-90)"/>
    <use href="#e" transform="rotate(110) translate(0 -43) rotate(-110)"/>
    <use href="#e" transform="rotate(-10) translate(0 -43) rotate(10)"/>
    <use href="#e" transform="rotate(10) translate(0 -43) rotate(-10)"/>
  </g>
