      <stop offset="0" stop-color="#f3d98b"/>
      <stop offset="1" stop-color="#c59a3a"/>
    </linearGradient>
    <radialGradient id="manto" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#2f5fa8"/>
      <stop offset="1" stop-color="#14305e"/>
